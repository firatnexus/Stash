name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.RO_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3

      - run: npm ci
      - name: Sync web assets into the Android project
        run: npm run sync

      - name: Restore release keystore
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.RO_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          RO_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          RO_KEYSTORE_PASSWORD: ${{ secrets.RO_KEYSTORE_PASSWORD }}
          RO_KEY_ALIAS: ${{ secrets.RO_KEY_ALIAS }}
          RO_KEY_PASSWORD: ${{ secrets.RO_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Build debug APK (no keystore configured)
        if: env.HAS_KEYSTORE != 'true'
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        id: apk
        run: |
          VERSION=$(sed -n "s/.*APP_VERSION = '\(.*\)'.*/\1/p" www/src/version.js)
          mkdir -p dist
          if [ "$HAS_KEYSTORE" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "dist/reels-organizer-$VERSION.apk"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "dist/reels-organizer-$VERSION-debug.apk"
          fi
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: reels-organizer-apk
          path: dist/

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Reels Organizer $GITHUB_REF_NAME" --notes "See CHANGELOG.md"
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
