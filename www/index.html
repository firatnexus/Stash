<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f3ef" />
    <meta name="color-scheme" content="light dark" />
    <!-- 'unsafe-inline' scripts: Capacitor injects its native bridge as an inline script.
         User data is always inserted as text nodes, never as HTML. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; frame-src https://www.instagram.com; object-src 'none'; base-uri 'self'"
    />
    <title>Sakla</title>
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="preload" href="fonts/satoshi-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="styles/app.css" />
    <script>
      // Apply the system theme before first paint to avoid a flash.
      if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
    </script>
  </head>
  <body>
    <a class="skip" href="#view">Skip to content</a>
    <div class="shell">
      <nav id="nav" class="nav" aria-label="Main"></nav>
      <main id="view" class="main" tabindex="-1"></main>
    </div>
    <!-- @capacitor/core runtime (copied from node_modules by scripts/vendor.mjs) -->
    <script src="vendor/capacitor.js"></script>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
